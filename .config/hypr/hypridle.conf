general {
    lock_cmd = ~/.config/quickshell/lock.sh
    before_sleep_cmd = loginctl lock-session && ~/.config/quickshell/lock.sh --wait-ready
    after_sleep_cmd = ~/.config/quickshell/lock.sh --after-sleep
}

# Lock Screen
listener {
    timeout = 150  # 2.5 minute (150 in seconds)
    on-timeout = loginctl lock-session
}

# Sleep
listener {
    timeout = 3600 # 1 hour
    on-timeout = systemctl suspend
}
