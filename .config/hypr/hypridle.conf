general {
    lock_cmd = ~/.config/quickshell/lock.sh
    before_sleep_cmd = loginctl lock-session && sleep 2
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && date +%s > /var/tmp/qs-wake
}

# Lock Screen
listener {
    timeout = 150  # 2.5 minute (150 in seconds)
    on-timeout = loginctl lock-session
}

# Turn off/on Monitors
listener {
    timeout = 300  # 5 minute (300 in seconds)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Sleep
listener {
    timeout = 3600 # 1 hour
    on-timeout = systemctl suspend
} 
